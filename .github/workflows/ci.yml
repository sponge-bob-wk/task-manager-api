# 工作流名称，显示在 Actions 页面
name: Node CI

# 触发条件
on:
  # 推送到 main 分支时触发
  push:
    branches: [ main ]
  # 针对 main 分支的 PR 时触发
  pull_request:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

# 定义任务
jobs:
  test:
    # 运行环境
    runs-on: ubuntu-latest

    # 矩阵策略，同时测试多个 Node.js 版本
    strategy:
      matrix:
        node-version: [18, 20, 24]

    # 步骤列表
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 安装指定版本的 Node.js
      - name: 使用 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 安装依赖，npm ci 严格按 package-lock.json 安装
      - run: npm ci

      # 运行测试
      - run: npm test
